<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- seed-db Brand Icon (Page 4 Design Spec - Dark Mode) -->
  <g id="database-cylinder-dark">
    <!-- Bottom Tier -->
    <path d="M40 160 C40 185 200 185 200 160 V185 C200 210 40 210 40 185 Z" fill="#1b4538"/>
    <path d="M40 160 C40 185 200 185 200 160" stroke="#123329" stroke-width="3" fill="none"/>
    <path d="M40 178 C40 203 200 203 200 178" stroke="#2a6352" stroke-width="3" fill="none"/>

    <!-- Middle Tier -->
    <path d="M40 125 C40 150 200 150 200 125 V150 C200 175 40 175 40 150 Z" fill="#245a4a"/>
    <path d="M40 125 C40 150 200 150 200 125" stroke="#194236" stroke-width="3" fill="none"/>
    <path d="M40 143 C40 168 200 168 200 143" stroke="#337863" stroke-width="3" fill="none"/>

    <!-- Top Tier Body -->
    <path d="M40 90 C40 115 200 115 200 90 V115 C200 140 40 140 40 115 Z" fill="#2e715d"/>
    <path d="M40 90 C40 115 200 115 200 90" stroke="#1f4f41" stroke-width="3" fill="none"/>

    <!-- Top Tier Cap (Disk Surface) -->
    <ellipse cx="120" cy="90" rx="80" ry="25" fill="#3c8e75" stroke="#245a4a" stroke-width="3"/>
    
    <!-- Soil Center Inset -->
    <ellipse cx="120" cy="90" rx="20" ry="6" fill="#15362c"/>
  </g>

  <!-- Sprout -->
  <g id="sprout-dark">
