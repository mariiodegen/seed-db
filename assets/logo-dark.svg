    <path d="M120 90 C120 75 120 62 120 54" stroke="#86efac" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Left Leaf -->
    <path d="M120 65 C100 65 80 50 86 35 C105 32 118 48 120 65 Z" fill="#86efac" stroke="#4ade80" stroke-width="2"/>
    <path d="M96 46 C105 48 114 55 120 65" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right Leaf -->
    <path d="M120 55 C138 52 160 38 152 24 C132 23 122 40 120 55 Z" fill="#4ade80" stroke="#22c55e" stroke-width="2"/>
    <path d="M142 34 C134 38 126 45 120 55" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
