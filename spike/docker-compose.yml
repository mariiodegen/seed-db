services:
  postgres:
    image: postgres:16
    container_name: seed-db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seed
      POSTGRES_PASSWORD: seed
      POSTGRES_DB: seed
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seed -d seed"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
